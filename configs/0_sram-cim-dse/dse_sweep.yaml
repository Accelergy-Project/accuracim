# Example config for CIM experiments

model:
  builder: workloads.models:build_model
  name: ResNet18

dataset:
  loader: workloads.dataset:get_imagenet_dataloader
  params:
    batch_size: 24
    num_workers: 2
    deterministic_dataloader: true
  eval_params:
    batch_size: 512
    num_workers: 2
    deterministic_dataloader: true

# Optional: override evaluation mode or metric function
# evaluation:
#   mode: classification
#   metric_fn: accuracim.evaluation:update_performance_metrics

paths:
  # relative to the working directory (or CIM_ROOT)
  # calibrated_dir: calibrated_config/ResNet18
  # cache_dir: cache

input_stats:
  N: 512
  override: false

adc_stats:
  N: 512
  override: false

precise_mode_noise_sources:
  - input_quantize
  - weight_quantize
  - adc_quantize

params_grid_list:
  - input_bits: [8]
    input_clip_percentile: [99.999]
    weight_clip_percentile: [99.999]
    weight_bits: [8]
    differential_weight: [true]
    weight_slice_lsb_to_msb: [1]
    input_slice_lsb_to_msb: [8]
    num_rows: [1152]
    # SRAM 32nm (high-K metal gate)
    weight_physical_noise:
     - type: ProportionalNoise
       args: [0.02128]
     - type: ProportionalNoise
       args: [0.0301]
     - type: ProportionalNoise
       args: [0.04257]
     - type: ProportionalNoise
       args: [0.0602]
     - type: ProportionalNoise
       args: [0.08513]
     - type: ProportionalNoise
       args: [0.1204]
    # Input 8-bit DAC from Signal-to-Noise Ratio.
    # Stdev. Error relative to full scale range (2^8 - 1) = 1/sqrt(8*10^(SNR/10))
    input_physical_noise:
     - type: StateIndependentNoise
       args: [0.000140752]
     - type: StateIndependentNoise
       args: [0.000315105]
     - type: StateIndependentNoise
       args: [0.000353553]
     - type: StateIndependentNoise
       args: [0.000705432]
     - type: StateIndependentNoise
       args: [0.001407521]
     - type: StateIndependentNoise
       args: [0.002502966]
     - type: StateIndependentNoise
       args: [0.002808374]
     - type: StateIndependentNoise
       args: [0.003239329]
     - type: StateIndependentNoise
       args: [0.003535534]
     - type: StateIndependentNoise
       args: [0.004450973]
     - type: StateIndependentNoise
       args: [0.004994074]
     - type: StateIndependentNoise
       args: [0.007054318]
     - type: StateIndependentNoise
       args: [0.007915074]
     - type: StateIndependentNoise
       args: [0.01118034]
     - type: StateIndependentNoise
       args: [0.012544548]
    # 12-bit ADC from Signal-to-Noise Ratio.
    # Stdev. Error relative to full scale range (2^12 - 1) = 1/sqrt(8*10^(SNR/10))
    adc_physical_noise:
     - type: StateIndependentNoise
       args: [0.00000284089]
     - type: StateIndependentNoise
       args: [0.0000044561]
     - type: StateIndependentNoise
       args: [0.00007136]
     - type: StateIndependentNoise
       args: [0.000082881]
     - type: StateIndependentNoise
       args: [0.0000996449]
     - type: StateIndependentNoise
       args: [0.000106771]
