# Weight conductance drift sweep -- no additive noise.
# Calibration is deliberately NOT redone per drift value: the ADC and input
# quantization ranges are learned once on the undrifted array and left fixed,
# which is the physical assumption being tested.

model:
  builder: workloads.models:build_model
  name: ResNet50

dataset:
  loader: workloads.dataset:get_imagenet_dataloader
  params:
    batch_size: 24
    num_workers: 2
    deterministic_dataloader: true
  eval_params:
    batch_size: 64
    num_workers: 2
    deterministic_dataloader: true

input_stats:
  N: 512
  override: false

adc_stats:
  N: 512
  override: false

precise_mode_noise_sources:
  - input_quantize
  - weight_quantize
  - adc_quantize

params_grid_list:
  - input_bits: [12]
    input_clip_percentile: [100]
    weight_clip_percentile: [100]
    weight_bits: [9]
    differential_weight: [true]
    weight_slice_lsb_to_msb: [3]
    input_slice_lsb_to_msb: [4]
    adc_clip_percentile: [100]
    adc_reference_mode: [layer]
    weight_drift:
     - type: ConductanceDrift
       args: [0.01]
     - type: ConductanceDrift
       args: [0.03]
     - type: ConductanceDrift
       args: [0.06]
     - type: ConductanceDrift
       args: [0.1]

run:
  N: 50000
  mode: simulate
  save_result: true
