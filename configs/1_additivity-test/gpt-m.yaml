# Example config for CIM experiments

model:
  builder: workloads.models:build_model
  name: GPT2-Medium

dataset:
  loader: workloads.dataset:get_llm_dataloader
  params:
    batch_size: 32
    num_workers: 2
    deterministic_dataloader: true
    block_size: 128
  eval_params:
    batch_size: 32
    num_workers: 2
    deterministic_dataloader: true
    block_size: 128

# Optional: override evaluation mode or metric function
evaluation:
  mode: next_token
  metric_fn: accuracim.evaluation:update_performance_metrics

paths:
  # relative to the working directory (or CIM_ROOT)
  # calibrated_dir: calibrated_config/GPT2-Small
  # cache_dir: cache

input_stats:
  N: 512
  override: false

adc_stats:
  N: 512
  override: false

precise_mode_noise_sources:
  - input_quantize
  - weight_quantize
  - adc_quantize

params_grid_list:
  - weight_clip_percentile: [100.0]
    weight_bits: [10]
    differential_weight: [true]
    weight_slice_lsb_to_msb: [2]
    input_bits: [12]
    input_clip_percentile: [99.9995]
    input_slice_lsb_to_msb: [6]
    weight_physical_noise:
     - type: ProportionalNoise
       args: [0.001]
     - type: ProportionalNoise
       args: [0.003]
     - type: ProportionalNoise
       args: [0.006]
     - type: ProportionalNoise
       args: [0.01]
    input_physical_noise:
     - type: StateIndependentNoise
       args: [0.00001]
     - type: StateIndependentNoise
       args: [0.00003]
     - type: StateIndependentNoise
       args: [0.00006]
     - type: StateIndependentNoise
       args: [0.0001]
    adc_physical_noise:
      - type: StateIndependentNoise
        args: [0.0000002]
      - type: StateIndependentNoise
        args: [0.0000004]
      - type: StateIndependentNoise
        args: [0.0000008]
      - type: StateIndependentNoise
        args: [0.0000016]
    adc_clip_percentile: [100.0]
    adc_reference_mode: [layer]

run:
  N: 2000
  mode: estimate
  save_result: true
