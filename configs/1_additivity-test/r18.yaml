# Example config for CIM experiments

model:
  builder: workloads.models:build_model
  name: ResNet18

dataset:
  loader: workloads.dataset:get_imagenet_dataloader
  params:
    batch_size: 24
    num_workers: 2
    deterministic_dataloader: true
  eval_params:
    batch_size: 512
    num_workers: 2
    deterministic_dataloader: true

# Optional: override evaluation mode or metric function
# evaluation:
#   mode: classification
#   metric_fn: accuracim.evaluation:update_performance_metrics

paths:
  # relative to the working directory (or CIM_ROOT)
  # calibrated_dir: calibrated_config/ResNet18
  # cache_dir: cache

input_stats:
  N: 512
  override: false

adc_stats:
  N: 512
  override: false

precise_mode_noise_sources:
  - input_quantize
  - weight_quantize
  - adc_quantize

params_grid_list:
  - input_bits: [8]
    input_clip_percentile: [100]
    weight_clip_percentile: [100]
    weight_bits: [8]
    differential_weight: [true]
    weight_slice_lsb_to_msb: [2]
    input_slice_lsb_to_msb: [2]
    weight_physical_noise:
     - type: ProportionalNoise
       args: [0.01]
     - type: ProportionalNoise
       args: [0.02]
     - type: ProportionalNoise
       args: [0.03]
     - type: ProportionalNoise
       args: [0.04]
    input_physical_noise:
     - type: StateIndependentNoise
       args: [0.0005]
     - type: StateIndependentNoise
       args: [0.001]
     - type: StateIndependentNoise
       args: [0.002]
     - type: StateIndependentNoise
       args: [0.004]
    adc_physical_noise:
      - type: StateIndependentNoise
        args: [0.00001]
      - type: StateIndependentNoise
        args: [0.00002]
      - type: StateIndependentNoise
        args: [0.00004]
      - type: StateIndependentNoise
        args: [0.00008]
    adc_clip_percentile: [100]
    adc_reference_mode: [layer]

run:
  N: 50000
  mode: estimate
  save_result: true
