# ResNet-34 on Imagenette (downloads itself): state-dependent weight noise

model:
  builder: workloads.models:build_model
  name: ResNet34

dataset:
  loader: workloads.dataset:get_imagenette_dataloader
  params:
    batch_size: 32
    num_workers: 2
  eval_params:
    batch_size: 256
    num_workers: 2

paths:
  # separate from ImageNet runs: caches are keyed by model and params, not dataset
  calibrated_dir: calibrated_config/ResNet34-imagenette
  cache_dir: cache/imagenette

input_stats:
  N: 256

adc_stats:
  N: 256

precise_mode_noise_sources:
  - input_quantize
  - weight_quantize
  - adc_quantize

params_grid_list:
  - weight_bits: [8]
    weight_slice_lsb_to_msb: [2]
    weight_physical_noise:
      - {type: ProportionalNoise, sweep: {start: 0.01, stop: 0.10, step: 0.005}}

run:
  N: 3925
  mode: estimate
  save_result: true
