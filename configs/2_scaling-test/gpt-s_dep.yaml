# Example config for CIM experiments

model:
  builder: workloads.models:build_model
  name: GPT2-Small

dataset:
  loader: workloads.dataset:get_llm_dataloader
  params:
    batch_size: 32
    num_workers: 2
    deterministic_dataloader: true
    block_size: 128
  eval_params:
    batch_size: 32
    num_workers: 2
    deterministic_dataloader: true
    block_size: 128

# Optional: override evaluation mode or metric function
evaluation:
  mode: next_token
  metric_fn: accuracim.evaluation:update_performance_metrics

paths:
  # relative to the working directory (or CIM_ROOT)
  # calibrated_dir: calibrated_config/GPT2-Small
  # cache_dir: cache

input_stats:
  N: 512
  override: false

adc_stats:
  N: 512
  override: false

precise_mode_noise_sources:
  - input_quantize
  - weight_quantize
  - adc_quantize

params_grid_list:
  - weight_clip_percentile: [99.999]
    weight_bits: [10]
    differential_weight: [true]
    weight_slice_lsb_to_msb: [2]
    weight_physical_noise:
     - type: ProportionalNoise
       args: [0.001]
     - type: ProportionalNoise
       args: [0.003]
     - type: ProportionalNoise
       args: [0.006]
     - type: ProportionalNoise
       args: [0.01]
     - type: ProportionalNoise
       args: [0.013]
     - type: ProportionalNoise
       args: [0.016]
     - type: ProportionalNoise
       args: [0.02]

run:
  N: 2000
  mode: estimate
  save_result: true
